name: Native wheels

on:
  push:
    branches: [main, codex/rust-pdf-acceleration]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, arch: x86_64, name: linux-x86_64, deployment: ''}
          - {os: ubuntu-24.04-arm, arch: aarch64, name: linux-aarch64, deployment: ''}
          - {os: windows-latest, arch: AMD64, name: windows-x86_64, deployment: ''}
          - {os: macos-15, arch: arm64, name: macos-arm64, deployment: '11.0'}
          - {os: macos-15-intel, arch: x86_64, name: macos-x86_64, deployment: '10.13'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - name: Build and test ABI3 wheel on Python 3.10
        env:
          CIBW_BUILD: cp310-*
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1
          CIBW_ENVIRONMENT: DOCVORTEX_BUILD_NATIVE=1 DOCVORTEX_COMPUTE_BACKEND=rust
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" DOCVORTEX_BUILD_NATIVE=1 DOCVORTEX_COMPUTE_BACKEND=rust'
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python {project}/tools/verify_native_wheel.py {project}/demo/pdfs/demo1.pdf && python -m pytest {project}/tests/test_native_parity.py {project}/tests/test_pdf_analysis_api.py {project}/tests/test_pdf_cpu_evidence.py -q
        run: uvx --from "cibuildwheel>=3.1,<4" cibuildwheel --output-dir wheelhouse
      - name: Install the exact built artifact on Python 3.14
        shell: bash
        run: |
          uv venv --seed --python 3.14
          uv run --no-project python -c "import pathlib, subprocess, sys; wheels=list(pathlib.Path('wheelhouse').glob('*.whl')); assert len(wheels)==1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0]), 'pytest'])"
      - name: Verify ABI3 and real parsing on Python 3.14
        env:
          DOCVORTEX_COMPUTE_BACKEND: rust
        run: uv run --no-project python tools/verify_native_wheel.py demo/pdfs/demo2.pdf
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  python-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - name: Build pure Python wheel and complete sdist
        env:
          DOCVORTEX_BUILD_NATIVE: '0'
        run: uv build
      - run: uvx twine check dist/*
      - name: Verify pure installation without native artifacts
        shell: bash
        run: |
          uv venv --seed
          uv run --no-project python -c "import pathlib, subprocess, sys; wheels=list(pathlib.Path('dist').glob('*-py3-none-any.whl')); assert len(wheels)==1; subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])"
          uv run --no-project python tools/verify_native_wheel.py demo/pdfs/demo2.pdf python
      - uses: actions/upload-artifact@v6
        with:
          name: dist-python
          path: dist/*
          if-no-files-found: error

  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p docvortex-core --locked
