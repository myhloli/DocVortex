name: Native wheels

# 仅由 Publish 工作流在发布时（workflow_call）或手动触发运行；
# push/PR 的 Rust 构建与测试已由 ci.yml 覆盖，不再重复跑轮子矩阵。
on:
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Build distributions without Rust checks or wheel tests'
        type: boolean
        default: false
  workflow_call:
    inputs:
      skip_ci:
        type: boolean
        default: false

permissions:
  contents: read

# 测试样本可能包含中文文件名；Windows 重定向日志也必须使用 UTF-8。
env:
  PYTHONUTF8: '1'

concurrency:
  group: native-wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, arch: x86_64, name: linux-x86_64, deployment: '', smoke: '3.14', build: 'cp310-*'}
          - {os: ubuntu-24.04-arm, arch: aarch64, name: linux-aarch64, deployment: '', smoke: '3.14', build: 'cp310-*'}
          - {os: windows-latest, arch: AMD64, name: windows-x86_64, deployment: '', smoke: '3.14', build: 'cp310-*'}
          - {os: windows-11-arm, arch: ARM64, name: windows-arm64, deployment: '', smoke: '3.14', build: 'cp311-*'}
          - {os: macos-15, arch: arm64, name: macos-arm64, deployment: '11.0', smoke: '3.14', build: 'cp310-*'}
          # 现有 magika/onnxruntime 依赖尚无 Intel macOS 的 cp314 包；另做 3.14 ABI 检查。
          - {os: macos-15-intel, arch: x86_64, name: macos-x86_64, deployment: '10.13', smoke: '3.13', build: 'cp310-*'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # GitHub 字符串比较不区分大小写，须按 runner 限定 Windows ARM64，避免误匹配 macOS arm64。
      - uses: actions/setup-python@v6
        if: matrix.os == 'windows-11-arm'
        id: python-arm64
        with:
          python-version: '3.14'
          architecture: arm64
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ steps.python-arm64.outputs.python-path || '3.14' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - name: Configure MSVC for ARM64 dependency builds
        if: matrix.os == 'windows-11-arm'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - name: Build and test ABI3 wheel on the platform's minimum Python
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_SKIP: '*-musllinux_*'
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: export CARGO_HOME=/opt/docvortex-cargo RUSTUP_HOME=/opt/docvortex-rustup; curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1
          CIBW_ENVIRONMENT: DOCVORTEX_BUILD_NATIVE=1 DOCVORTEX_COMPUTE_BACKEND=rust
          CIBW_ENVIRONMENT_LINUX: 'PATH="/opt/docvortex-cargo/bin:$PATH" CARGO_HOME=/opt/docvortex-cargo RUSTUP_HOME=/opt/docvortex-rustup DOCVORTEX_BUILD_NATIVE=1 DOCVORTEX_COMPUTE_BACKEND=rust'
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
          CIBW_TEST_REQUIRES: pytest psutil
          CIBW_TEST_SKIP: ${{ inputs.skip_ci && '*' || '' }}
          CIBW_TEST_COMMAND: python {project}/tools/verify_native_wheel.py {project}/demo/pdfs/demo1.pdf && python -m pytest {project}/tests/test_native_parity.py {project}/tests/test_rule_graphics_acceleration.py {project}/tests/test_rule_text_acceleration.py {project}/tests/test_rule_pixel_form_acceleration.py {project}/tests/test_rule_layout_batch_acceleration.py {project}/tests/test_rule_numeric_graphics_acceleration.py {project}/tests/test_rule_fill_bands_acceleration.py {project}/tests/test_native_statistics.py {project}/tests/test_native_round3.py {project}/tests/test_native_round4.py {project}/tests/test_native_round5.py {project}/tests/test_native_round6.py {project}/tests/test_native_round7.py {project}/tests/test_pdfium_bridge.py {project}/tests/test_pdf_object_bridge.py {project}/tests/test_pdf_classify_page_loading.py {project}/tests/test_pdf_classify_resource_graph.py {project}/tests/test_pdf_drawing_lines_extraction.py {project}/tests/test_pdf_native_graphics_components.py {project}/tests/unittest/test_flash_pdf_auxiliary_text.py {project}/tests/test_pdf_snapshot.py {project}/tests/test_native_inline_styles.py {project}/tests/test_native_bitmap_crops.py {project}/tests/test_pdf_render_session.py {project}/tests/test_native_font_runtime.py {project}/tests/test_native_text_pipeline.py {project}/tests/test_native_text_snapshot.py {project}/tests/test_native_classification.py {project}/tests/unittest/test_flash_pdf_char_geometry.py {project}/tests/test_native_table_candidates.py {project}/tests/test_pdf_analysis_api.py {project}/tests/test_pdf_cpu_evidence.py -q && python -m pip install pypdfium2==5.10.1 && python {project}/tools/verify_native_wheel.py {project}/demo/pdfs/demo2.pdf && python -m pytest {project}/tests/test_pdfium_bridge.py {project}/tests/test_pdf_object_bridge.py {project}/tests/test_pdf_classify_page_loading.py {project}/tests/test_pdf_classify_resource_graph.py {project}/tests/test_pdf_drawing_lines_extraction.py {project}/tests/test_pdf_native_graphics_components.py {project}/tests/unittest/test_flash_pdf_auxiliary_text.py {project}/tests/test_pdf_snapshot.py {project}/tests/test_native_inline_styles.py {project}/tests/test_native_bitmap_crops.py {project}/tests/test_pdf_render_session.py {project}/tests/test_native_font_runtime.py {project}/tests/test_native_text_pipeline.py {project}/tests/test_native_text_snapshot.py {project}/tests/test_native_classification.py {project}/tests/unittest/test_flash_pdf_char_geometry.py {project}/tests/test_native_table_candidates.py {project}/tests/test_native_round4.py {project}/tests/test_native_round5.py {project}/tests/test_native_round6.py {project}/tests/test_native_round7.py -q
        run: uvx --from "cibuildwheel>=3.1,<4" cibuildwheel --output-dir wheelhouse
      - name: Verify binary ABI on Python 3.14 without optional application dependencies
        if: ${{ !inputs.skip_ci }}
        run: uv run --no-project --python "${{ steps.python-arm64.outputs.python-path || '3.14' }}" python tools/verify_native_abi.py wheelhouse
      - name: Install the exact built artifact on the current supported dependency stack
        if: ${{ !inputs.skip_ci }}
        run: |
          uv venv --seed --python "${{ steps.python-arm64.outputs.python-path || matrix.smoke }}"
          uv run --no-project --python "${{ steps.python-arm64.outputs.python-path || matrix.smoke }}" python -c "import pathlib, subprocess, sys; wheels=list(pathlib.Path('wheelhouse').glob('*.whl')); assert len(wheels)==1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0]), 'pytest', 'psutil', 'pypdfium2==5.13.0'])"
      - name: Verify installed wheel and real parsing
        if: ${{ !inputs.skip_ci }}
        env:
          DOCVORTEX_COMPUTE_BACKEND: rust
        run: uv run --no-project --python "${{ steps.python-arm64.outputs.python-path || matrix.smoke }}" python tools/verify_native_wheel.py demo/pdfs/demo2.pdf
      - name: Verify Windows ARM64 native installation and reportlab fallback
        if: ${{ matrix.os == 'windows-11-arm' && !inputs.skip_ci }}
        run: uv run --no-project python tools/verify_windows_arm64_install.py
      - name: Verify generated dense table with the installed wheel
        if: ${{ !inputs.skip_ci }}
        env:
          DOCVORTEX_COMPUTE_BACKEND: rust
        run: |
          uv run --no-project --python "${{ steps.python-arm64.outputs.python-path || matrix.smoke }}" python tools/generate_dense_pdf.py dense-table.pdf
          uv run --no-project --python "${{ steps.python-arm64.outputs.python-path || matrix.smoke }}" python tools/verify_native_wheel.py dense-table.pdf
          uv run --no-project --python "${{ steps.python-arm64.outputs.python-path || matrix.smoke }}" python -m pytest tests/test_native_inline_styles.py tests/test_native_bitmap_crops.py tests/test_pdfium_bridge.py tests/test_pdf_object_bridge.py tests/test_pdf_classify_page_loading.py tests/test_pdf_classify_resource_graph.py tests/test_pdf_drawing_lines_extraction.py tests/test_pdf_native_graphics_components.py tests/unittest/test_flash_pdf_auxiliary_text.py tests/test_pdf_snapshot.py tests/test_pdf_render_session.py tests/test_native_font_runtime.py tests/test_native_text_pipeline.py tests/test_native_text_snapshot.py tests/test_native_classification.py tests/unittest/test_flash_pdf_char_geometry.py tests/test_native_table_candidates.py tests/test_native_round3.py tests/test_native_round4.py tests/test_native_round5.py tests/test_native_round6.py tests/test_native_round7.py -q
      # 性能对比仅在本机执行；平台矩阵保留构建、ABI、安装和正确性检查。
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  windows-arm64-install:
    # 同一发行物检查两个 Python 端点和两个 PDFium 版本；pyclipper 缺少 wheel 时允许源码构建。
    needs: wheels
    if: ${{ !inputs.skip_ci }}
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        pdfium: ['5.10.1', '5.13.0']
    env:
      DOCVORTEX_COMPUTE_BACKEND: rust
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: python-arm64
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ steps.python-arm64.outputs.python-path }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - uses: actions/download-artifact@v7
        with:
          name: dist-windows-arm64
          path: wheelhouse
      - name: Install the exact ARM64 wheel with regular dependency resolution
        run: |
          uv venv --seed
          uv run --no-project python -c "import pathlib, subprocess, sys; wheel,=pathlib.Path('wheelhouse').glob('*.whl'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel), 'pytest', 'psutil', 'pypdfium2==${{ matrix.pdfium }}'])"
          uv run --no-project python -m pip check
      - name: Verify ABI and actual installed ARM64 extension
        run: |
          uv run --no-project python tools/verify_native_abi.py wheelhouse
          uv run --no-project python tools/verify_windows_arm64_install.py
      - name: Verify real PDF and dense table Python/Rust parity
        run: |
          uv run --no-project python tools/verify_native_wheel.py demo/pdfs/demo2.pdf
          uv run --no-project python tools/generate_dense_pdf.py dense-table.pdf
          uv run --no-project python tools/verify_native_wheel.py dense-table.pdf
      - name: Verify PDFium bridge, native parity and reportlab PDF export
        run: >-
          uv run --no-project python -m pytest
          tests/test_native_parity.py tests/test_pdfium_bridge.py tests/test_pdf_object_bridge.py
          tests/unittest/test_pdf_render.py tests/unittest/test_pdf_render_diagnostics.py
          tests/test_complete_pipeline.py tests/test_public_pipeline.py tests/test_system_font_pdf_pipeline.py
          tests/test_pdf_render_pool.py tests/test_pdf_render_session.py -q

  python-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - name: Build pure Python wheel and complete sdist
        env:
          DOCVORTEX_BUILD_NATIVE: '0'
        run: uv build
      - run: uvx twine check dist/*
      - name: Verify pure installation without native artifacts
        if: ${{ !inputs.skip_ci }}
        shell: bash
        run: |
          uv venv --seed
          uv run --no-project python -c "import pathlib, subprocess, sys; wheels=list(pathlib.Path('dist').glob('*-py3-none-any.whl')); assert len(wheels)==1; subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])"
          uv run --no-project python tools/verify_native_wheel.py demo/pdfs/demo2.pdf python
      - uses: actions/upload-artifact@v6
        with:
          name: dist-python
          path: dist/*
          if-no-files-found: error

  rust-checks:
    if: ${{ !inputs.skip_ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p docvortex-core --locked
