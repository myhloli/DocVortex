name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Skip main CI and wheel tests/benchmarks; still build all distributions'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The CI gate follows first-parent history to the latest passing commit, so it needs the full history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: Verify successful main CI
        if: ${{ !inputs.skip_ci }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/verify_release_ci_gate.py
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          tree = ast.parse(pathlib.Path('src/docvortex/version.py').read_text())
          version = next(ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets))
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag does not match package version')
          PY
  distributions:
    needs: gate
    uses: ./.github/workflows/native-wheels.yml
    with:
      skip_ci: ${{ inputs.skip_ci || false }}

  publish:
    needs: distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/docvortex/
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      # Publish the draft using the workflow token to avoid triggering the release workflow again.
      - name: Publish GitHub release after manual distribution
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
