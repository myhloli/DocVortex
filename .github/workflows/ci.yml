name: CI

on:
  push:
    branches: [main]
    # 纯版本号 bump 的发布提交复用祖先绿灯（见 tools/verify_release_ci_gate.py），
    # 不再重复触发全量 CI；混合改动的 push 不受影响。
    paths-ignore: ['src/docvortex/version.py']
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  DOCVORTEX_BUILD_NATIVE: '0'
  DOCVORTEX_COMPUTE_BACKEND: python

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-arm64-native-abi:
    # 独立核验 ARM64 内核 ABI；包含 pyclipper 的应用安装由发行物矩阵验收。
    runs-on: windows-11-arm
    env:
      DOCVORTEX_BUILD_NATIVE: '1'
    steps:
      - uses: actions/checkout@v6
      # uv 的 Windows 托管 Python 默认可能选 x64；显式使用原生 ARM64 解释器及其导入库。
      - uses: actions/setup-python@v6
        id: arm64-minimum
        with:
          python-version: '3.11'
          architecture: arm64
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ steps.arm64-minimum.outputs.python-path }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: aarch64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - name: Build actual Windows ARM64 ABI3 wheel
        env:
          CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
        run: uv build --wheel --python "${{ steps.arm64-minimum.outputs.python-path }}" --out-dir wheelhouse
      - name: Verify binary on minimum Python 3.11
        run: uv run --no-project --python "${{ steps.arm64-minimum.outputs.python-path }}" python tools/verify_native_abi.py wheelhouse
      - uses: actions/setup-python@v6
        id: arm64-current
        with:
          python-version: '3.14'
          architecture: arm64
      - name: Verify binary on Python 3.14
        run: uv run --no-project --python "${{ steps.arm64-current.outputs.python-path }}" python tools/verify_native_abi.py wheelhouse
      - uses: actions/upload-artifact@v6
        with:
          name: native-abi-windows-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # ABI3 轮子只需验证最低 cp310 与最新 3.14 两个端点。
        python: ['3.10', '3.14']
        backend: [python, rust]
    runs-on: ${{ matrix.os }}
    env:
      DOCVORTEX_BUILD_NATIVE: ${{ matrix.backend == 'rust' && '1' || '0' }}
      DOCVORTEX_COMPUTE_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.backend == 'rust'
        with:
          toolchain: '1.98.1'
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - run: uv pip install ".[test]" "pypdfium2==5.10.1"
      - run: uv run --no-project python -m pytest -q -n auto --deselect tests/unittest/test_native_pdf_table_demo_manifest.py::test_demo_sparse_table_confidence_manifest
      - name: Verify independent installation
        run: uv run --no-project python -c "import importlib.util, docvortex; assert importlib.util.find_spec('docgale') is None; assert importlib.util.find_spec('mineru') is None; assert importlib.util.find_spec('pdftext') is None; assert importlib.util.find_spec('fast_langdetect') is None; assert importlib.util.find_spec('fasttext') is None; assert importlib.util.find_spec('cv2') is None"

  pdfium-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv venv
      - run: uv pip install ".[test]" "pypdfium2==5.13.0"
      - run: uv run --no-project python tools/review_flash_regression.py --output history-output
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: history-geometry-ubuntu-pdfium-current
          path: history-output/summary.json
          retention-days: 14
      - run: uv run --no-project python -m pytest -q -n auto --deselect tests/unittest/test_native_pdf_table_demo_manifest.py::test_demo_sparse_table_confidence_manifest
        if: ${{ !cancelled() }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff==0.14.2 check src
      - run: uvx ruff==0.14.2 format --check src

  # native-wheels.yml 不再随 push/PR 触发后，Rust 静态检查与单元测试由本工作流把守。
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p docvortex-core --locked

  baseline-diagnostic:
    name: Existing sparse-table gold difference (diagnostic)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv venv
      - run: uv pip install ".[test]" "pypdfium2==5.10.1"
      - run: uv run --no-project python -m pytest -q --tb=short tests/unittest/test_native_pdf_table_demo_manifest.py

  pydantic-minimum:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - run: uv pip install ".[test]" "pydantic==2.12.5" "pypdfium2==5.10.1"
      - run: uv run --no-project python -m pytest -q -n auto --deselect tests/unittest/test_native_pdf_table_demo_manifest.py::test_demo_sparse_table_confidence_manifest

  platform-artifacts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - run: uv venv
      - run: uv pip install ".[test]" "pydantic==2.12.5" "pypdfium2==5.10.1"
      - run: uv run --no-project python tools/capture_platform_layout.py --output platform-output
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: platform-layout-${{ matrix.os }}
          path: platform-output/
          retention-days: 14
      - run: uv run --no-project python tools/review_flash_regression.py --output history-output
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: history-geometry-${{ matrix.os }}
          path: history-output/summary.json
          retention-days: 14

  font-platform-consistency:
    needs: [platform-artifacts, pdfium-current]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v7
        with:
          pattern: platform-layout-*
          path: platforms
      - run: uv run --no-project python tools/compare_font_platforms.py platforms/platform-layout-macos-latest platforms/platform-layout-ubuntu-latest platforms/platform-layout-windows-latest --output font-platform-comparison.json
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: font-platform-comparison
          path: font-platform-comparison.json
          retention-days: 14
      - uses: actions/download-artifact@v7
        if: ${{ !cancelled() }}
        with:
          pattern: history-geometry-*
          path: history
      - name: Diff history geometry against the macOS reference (ubuntu-latest)
        if: ${{ !cancelled() }}
        run: uv run --no-project python tools/diff_history_geometry.py history/history-geometry-macos-latest history/history-geometry-ubuntu-latest --output history-diff-ubuntu-latest.json
      - name: Diff history geometry against the macOS reference (windows-latest)
        if: ${{ !cancelled() }}
        run: uv run --no-project python tools/diff_history_geometry.py history/history-geometry-macos-latest history/history-geometry-windows-latest --output history-diff-windows-latest.json
      - name: Diff history geometry against the macOS reference (ubuntu pdfium-current)
        if: ${{ !cancelled() }}
        run: uv run --no-project python tools/diff_history_geometry.py history/history-geometry-macos-latest history/history-geometry-ubuntu-pdfium-current --output history-diff-ubuntu-pdfium-current.json
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: history-geometry-diff
          path: history-diff-*.json
          retention-days: 14
