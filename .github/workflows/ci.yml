name: CI

on:
  push:
    branches: [main]
    # 纯版本号 bump 的发布提交复用祖先绿灯（见 tools/verify_release_ci_gate.py），
    # 不再重复触发全量 CI；混合改动的 push 不受影响。
    paths-ignore: ['src/docvortex/version.py']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    # 每个平台仅用最低 CPython 构建一次 ABI3 wheel，其他环境独立解析并安装依赖。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - run: uv venv
      - uses: ./.github/actions/cargo-cache
        with:
          key: release-abi3-py3.11-${{ hashFiles('Cargo.toml', 'setup.py', 'pyproject.toml') }}
          disabled: ${{ vars.DOCVORTEX_DISABLE_CARGO_CACHE == '1' }}
      - name: Build current platform ABI3 wheel
        run: >-
          uv run --no-project python tools/ci_build_metrics.py run --name build --require-cargo --
          uv build --wheel --out-dir wheelhouse
      - name: Verify minimum Python ABI
        run: uv run --no-project python tools/verify_native_abi.py wheelhouse
      - name: Bind wheel to this source and workflow run
        run: uv run --no-project python tools/ci_wheel_reuse.py publish wheelhouse
      - uses: actions/upload-artifact@v6
        with:
          name: ci-wheel-${{ github.sha }}-${{ matrix.os }}
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: ci-metrics-build-wheels-${{ matrix.os }}
          path: build/ci-metrics/
          retention-days: 14

  windows-arm64-native-abi:
    # 独立核验 ARM64 内核 ABI；包含 pyclipper 的应用安装由发行物矩阵验收。
    runs-on: windows-11-arm
    env:
      # 缓存恢复和实际构建必须看到同一个目标 triple。
      CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      # uv 的 Windows 托管 Python 默认可能选 x64；显式使用原生 ARM64 解释器及其导入库。
      - uses: actions/setup-python@v6
        id: arm64-minimum
        with:
          python-version: '3.11'
          architecture: arm64
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ steps.arm64-minimum.outputs.python-path }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: aarch64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - uses: ./.github/actions/cargo-cache
        with:
          key: release-abi3-py311-arm64-${{ hashFiles('Cargo.toml', 'setup.py', 'pyproject.toml') }}
          disabled: ${{ vars.DOCVORTEX_DISABLE_CARGO_CACHE == '1' }}
      - name: Build actual Windows ARM64 ABI3 wheel
        run: >-
          uv run --no-project --python "${{ steps.arm64-minimum.outputs.python-path }}" python tools/ci_build_metrics.py run --name build --require-cargo --
          uv build --wheel --python "${{ steps.arm64-minimum.outputs.python-path }}" --out-dir wheelhouse
      - name: Verify binary on minimum Python 3.11
        run: >-
          uv run --no-project --python "${{ steps.arm64-minimum.outputs.python-path }}" python tools/ci_build_metrics.py run --name abi-311 --
          uv run --no-project --python "${{ steps.arm64-minimum.outputs.python-path }}" python tools/verify_native_abi.py wheelhouse
      - uses: actions/setup-python@v6
        id: arm64-current
        with:
          python-version: '3.14'
          architecture: arm64
      - name: Verify binary on Python 3.14
        run: >-
          uv run --no-project --python "${{ steps.arm64-current.outputs.python-path }}" python tools/ci_build_metrics.py run --name abi-314 --
          uv run --no-project --python "${{ steps.arm64-current.outputs.python-path }}" python tools/verify_native_abi.py wheelhouse
      - name: Record verified wheel identity
        run: uv run --no-project --python "${{ steps.arm64-current.outputs.python-path }}" python tools/ci_build_metrics.py wheels wheelhouse
      - uses: actions/upload-artifact@v6
        with:
          name: native-abi-windows-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: ci-metrics-windows-arm64-native-abi
          path: build/ci-metrics/
          retention-days: 14

  test:
    needs: build-wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # ABI3 轮子验证最低 cp311 与最新 3.14 两个端点。
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - uses: actions/download-artifact@v7
        with:
          name: ci-wheel-${{ github.sha }}-${{ matrix.os }}
          path: wheelhouse
      - name: Install with the minimum platform ONNX Runtime
        run: >-
          uv run --no-project python tools/ci_wheel_reuse.py install wheelhouse "pypdfium2==5.13.0" "${{ matrix.os == 'windows-latest' && 'onnxruntime-directml' || 'onnxruntime' }}==1.24.4"
      - name: Verify shared wheel ABI on this Python
        run: uv run --no-project python tools/verify_native_abi.py wheelhouse
      - name: Test installed package
        run: uv run --no-project python tools/ci_build_metrics.py run --profile wheel --name tests -- uv run --no-project python -m pytest -q -n auto
      - name: Verify independent installation
        run: uv run --no-project python -c "import importlib.util, docvortex; assert importlib.util.find_spec('docgale') is None; assert importlib.util.find_spec('mineru') is None; assert importlib.util.find_spec('pdftext') is None; assert importlib.util.find_spec('fast_langdetect') is None; assert importlib.util.find_spec('fasttext') is None; assert importlib.util.find_spec('cv2') is None"
      - name: Verify platform runtime distributions
        run: uv run --no-project python tools/verify_runtime_dependencies.py
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: ci-metrics-test-${{ matrix.os }}-${{ matrix.python }}
          path: build/ci-metrics/
          retention-days: 14

  python-minors:
    needs: build-wheels
    # 中间版本验证 Python 数值语义和公开接口，PDFium 统一使用 5.13.0。
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - uses: actions/download-artifact@v7
        with:
          name: ci-wheel-${{ github.sha }}-ubuntu-latest
          path: wheelhouse
      - name: Install verified wheel
        run: >-
          uv run --no-project python tools/ci_wheel_reuse.py install wheelhouse "pypdfium2==5.13.0"
      - name: Verify native numeric and public contracts
        run: >-
          uv run --no-project python tools/ci_build_metrics.py run --profile wheel --name tests --
          uv run --no-project python -m pytest -q
          tests/test_compute_backend.py tests/test_native_parity.py
          tests/test_native_statistics.py tests/test_native_round4.py
          tests/test_image_numeric.py tests/test_public_pipeline.py
          tests/test_public_image_api.py tests/test_public_export_api.py
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: ci-metrics-python-minors-${{ matrix.python }}
          path: build/ci-metrics/
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff==0.14.2 check src tools/ci_build_metrics.py tools/ci_wheel_reuse.py
      - run: uvx ruff==0.14.2 format --check src tools/ci_build_metrics.py tools/ci_wheel_reuse.py

  # native-wheels.yml 不再随 push/PR 触发后，Rust 静态检查与单元测试由本工作流把守。
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: ./.github/actions/cargo-cache
        with:
          key: dev-test-${{ hashFiles('Cargo.toml', 'setup.py', 'pyproject.toml') }}
          python-command: python3
          disabled: ${{ vars.DOCVORTEX_DISABLE_CARGO_CACHE == '1' }}
      - run: cargo fmt --all --check
      - name: Check Rust
        run: python3 tools/ci_build_metrics.py run --name clippy --profile dev -- cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust
        run: python3 tools/ci_build_metrics.py run --name rust-tests --profile test -- cargo test -p docvortex-core --locked
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: ci-metrics-rust-checks
          path: build/ci-metrics/
          retention-days: 14

  pydantic-minimum:
    needs: build-wheels
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - uses: actions/download-artifact@v7
        with:
          name: ci-wheel-${{ github.sha }}-ubuntu-latest
          path: wheelhouse
      - name: Install with minimum Pydantic
        run: >-
          uv run --no-project python tools/ci_wheel_reuse.py install wheelhouse "pydantic==2.12.5" "pypdfium2==5.13.0"
      - name: Test installed package
        run: uv run --no-project python tools/ci_build_metrics.py run --profile wheel --name tests -- uv run --no-project python -m pytest -q -n auto
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: ci-metrics-pydantic-minimum-${{ matrix.python }}
          path: build/ci-metrics/
          retention-days: 14

  platform-artifacts:
    needs: build-wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - run: uv venv
      - uses: actions/download-artifact@v7
        with:
          name: ci-wheel-${{ github.sha }}-${{ matrix.os }}
          path: wheelhouse
      - name: Install platform artifact environment
        run: >-
          uv run --no-project python tools/ci_wheel_reuse.py install wheelhouse "pydantic==2.12.5" "pypdfium2==5.13.0"
      - name: Capture platform layout
        run: uv run --no-project python tools/ci_build_metrics.py run --profile wheel --name platform-layout -- uv run --no-project python tools/capture_platform_layout.py --output platform-output
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: platform-layout-${{ matrix.os }}
          path: platform-output/
          retention-days: 14
      - run: uv run --no-project python tools/ci_build_metrics.py run --profile wheel --name history-geometry -- uv run --no-project python tools/review_flash_regression.py --output history-output
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: history-geometry-${{ matrix.os }}
          path: history-output/summary.json
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: ci-metrics-platform-artifacts-${{ matrix.os }}
          path: build/ci-metrics/
          retention-days: 14

  font-platform-consistency:
    needs: platform-artifacts
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v7
        with:
          pattern: platform-layout-*
          path: platforms
      - run: uv run --no-project python tools/compare_font_platforms.py platforms/platform-layout-macos-latest platforms/platform-layout-ubuntu-latest platforms/platform-layout-windows-latest --output font-platform-comparison.json
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: font-platform-comparison
          path: font-platform-comparison.json
          retention-days: 14
      - uses: actions/download-artifact@v7
        if: ${{ !cancelled() }}
        with:
          pattern: history-geometry-*
          path: history
      - name: Diff history geometry against the macOS reference (ubuntu-latest)
        if: ${{ !cancelled() }}
        run: uv run --no-project python tools/diff_history_geometry.py history/history-geometry-macos-latest history/history-geometry-ubuntu-latest --output history-diff-ubuntu-latest.json
      - name: Diff history geometry against the macOS reference (windows-latest)
        if: ${{ !cancelled() }}
        run: uv run --no-project python tools/diff_history_geometry.py history/history-geometry-macos-latest history/history-geometry-windows-latest --output history-diff-windows-latest.json
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: history-geometry-diff
          path: history-diff-*.json
          retention-days: 14
